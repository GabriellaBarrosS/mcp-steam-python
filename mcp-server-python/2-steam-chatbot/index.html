<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Steam Buddy · Chatbot Groq</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="static/style.css">
</head>
<body>
    <div id="chat-container">
        <div id="chat-header">
            <div id="chat-header-avatar">🎮</div>
            <div id="chat-header-info">
                <h2>Steam Buddy</h2>
                <span id="status-line"><span id="status-dot"></span>online · pronto pra jogar</span>
            </div>
        </div>
        <div id="chat-box">
            <!-- As mensagens aparecerão aqui -->
            <div class="message ai-message">
                <p>E aí! Sou seu assistente de Steam 🕹️ Pergunta sobre promoções, sua biblioteca, conquistas ou qualquer jogo.</p>
            </div>
        </div>
        <div id="input-container">
            <input type="text" id="user-input" placeholder="Digite sua mensagem...">
            <button id="send-button" aria-label="Enviar">▶</button>
        </div>
    </div>
    <script src="static/script.js"></script>
</body>
</html>
